<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>家族予定表</title>

<style>

body{
  font-family:sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
}

.calendar-header{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin-bottom:20px;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#4a90e2;
  color:white;
  font-size:14px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  max-width:1200px;
  margin:auto;
}

.day-name{
  background:#333;
  color:white;
  padding:10px;
  text-align:center;
  border-radius:6px;
  font-weight:bold;
}

.day{
  background:white;
  min-height:140px;
  border-radius:10px;
  padding:8px;
  position:relative;
  cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,0.1);
}

.day:hover{
  background:#eef5ff;
}

.empty{
  background:transparent;
  box-shadow:none;
  cursor:default;
}

.date{
  font-weight:bold;
  margin-bottom:6px;
}

.event{
  font-size:11px;
  background:#4a90e2;
  color:white;
  padding:3px 6px;
  border-radius:5px;
  margin-bottom:3px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:12px;
  width:360px;
  max-height:90vh;
  overflow-y:auto;
}

.modal-content h2{
  margin-top:0;
}

.modal-content input,
.modal-content select{
  width:100%;
  margin-bottom:12px;
  padding:8px;
  box-sizing:border-box;
}

.actions{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.save-btn{
  background:#28a745;
}

.close-btn{
  background:#999;
}

.delete-btn{
  background:#dc3545;
  padding:5px 10px;
  font-size:12px;
}

.schedule-list{
  max-width:1200px;
  margin:40px auto 0;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 1px 4px rgba(0,0,0,0.1);
}

.schedule-list h2{
  margin-top:0;
}

.list-item{
  padding:10px;
  border-bottom:1px solid #ddd;
}

.list-item:last-child{
  border-bottom:none;
}

.modal-events{
  margin-top:20px;
}

.modal-event-item{
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.no-schedule{
  color:#666;
}

</style>
</head>

<body>

<h1>家族予定表</h1>

<div class="calendar-header">
  <button onclick="changeMonth(-1)">◀ 前月</button>
  <h2 id="monthYear"></h2>
  <button onclick="changeMonth(1)">次月 ▶</button>
</div>

<div class="calendar" id="calendar"></div>

<div class="schedule-list">
  <h2>当月の予定一覧</h2>
  <div id="monthlyList"></div>
</div>

<!-- モーダル -->
<div class="modal" id="modal">

  <div class="modal-content">

    <h2 id="selectedDate"></h2>

    <!-- 名前 -->
    <select id="name">
      <option value="">名前を選択</option>
      <option value="パパ">パパ</option>
      <option value="ママ">ママ</option>
      <option value="トウカ">トウカ</option>
      <option value="ヒヨリ">ヒヨリ</option>
      <option value="祖母">祖母</option>
      <option value="祖父">祖父</option>
    </select>

    <!-- 予定 -->
    <input type="text" id="schedule" placeholder="予定">

    <!-- 時 -->
    <select id="hour"></select>

    <!-- 分 -->
    <select id="minute">
      <option value="00">00</option>
      <option value="30">30</option>
    </select>

    <div class="actions">
      <button class="close-btn" onclick="closeModal()">閉じる</button>
      <button class="save-btn" onclick="saveEvent()">決定</button>
    </div>

    <!-- 当日の予定 -->
    <div class="modal-events">
      <h3>この日の予定</h3>
      <div id="dayEvents"></div>
    </div>

  </div>

</div>

<script>

let currentDate = new Date();
let selectedDay = null;

let events =
  JSON.parse(localStorage.getItem("familyEvents")) || {};


// 時間プルダウン
const hourSelect =
  document.getElementById("hour");

for(let i=0;i<24;i++){

  const option =
    document.createElement("option");

  const value =
    i.toString().padStart(2,"0");

  option.value = value;
  option.textContent = value;

  hourSelect.appendChild(option);
}


// カレンダー表示
function renderCalendar(){

  const calendar =
    document.getElementById("calendar");

  calendar.innerHTML = "";

  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth();

  document.getElementById("monthYear").innerText =
    `${year}年 ${month+1}月`;

  const dayNames =
    ["日","月","火","水","木","金","土"];

  dayNames.forEach(day=>{

    const div =
      document.createElement("div");

    div.className = "day-name";
    div.innerText = day;

    calendar.appendChild(div);

  });

  const firstDay =
    new Date(year,month,1).getDay();

  const lastDate =
    new Date(year,month+1,0).getDate();

  // 空白
  for(let i=0;i<firstDay;i++){

    const empty =
      document.createElement("div");

    empty.className = "day empty";

    calendar.appendChild(empty);
  }

  // 日付
  for(let day=1;day<=lastDate;day++){

    const dateKey =
      `${year}-${month+1}-${day}`;

    const dayDiv =
      document.createElement("div");

    dayDiv.className = "day";

    dayDiv.innerHTML =
      `<div class="date">${day}</div>`;

    // 最大5件表示
    if(events[dateKey]){

      events[dateKey]
        .slice(0,5)
        .forEach(ev=>{

          const evDiv =
            document.createElement("div");

          evDiv.className = "event";

          evDiv.innerText =
            `${ev.time} ${ev.name}`;

          dayDiv.appendChild(evDiv);

        });
    }

    dayDiv.addEventListener("click", ()=>{

      openModal(dateKey);

    });

    calendar.appendChild(dayDiv);
  }

  renderMonthlyList();
}


// モーダル開く
function openModal(date){

  selectedDay = date;

  document.getElementById("selectedDate").innerText =
    `${date} の予定`;

  document.getElementById("name").value = "";
  document.getElementById("schedule").value = "";
  document.getElementById("hour").value = "00";
  document.getElementById("minute").value = "00";

  document.getElementById("modal").style.display =
    "flex";

  renderDayEvents();
}


// モーダル閉じる
function closeModal(){

  document.getElementById("modal").style.display =
    "none";
}


// 保存
function saveEvent(){

  const name =
    document.getElementById("name").value;

  const schedule =
    document.getElementById("schedule").value;

  const hour =
    document.getElementById("hour").value;

  const minute =
    document.getElementById("minute").value;

  const time = `${hour}:${minute}`;

  if(!name || !schedule){

    alert("すべて入力してください");

    return;
  }

  if(!events[selectedDay]){

    events[selectedDay] = [];
  }

  events[selectedDay].push({
    name,
    schedule,
    time
  });

  // 時間順
  events[selectedDay].sort((a,b)=>
    a.time.localeCompare(b.time)
  );

  saveLocal();

  renderCalendar();
  renderDayEvents();

  document.getElementById("schedule").value = "";
}


// 削除
function deleteEvent(index){

  if(!confirm("この予定を削除しますか？")){
    return;
  }

  // indexの予定削除
  events[selectedDay].splice(index,1);

  // 予定ゼロなら日付ごと削除
  if(events[selectedDay].length === 0){

    delete events[selectedDay];
  }

  saveLocal();

  renderCalendar();
  renderDayEvents();
}


// localStorage保存
function saveLocal(){

  localStorage.setItem(
    "familyEvents",
    JSON.stringify(events)
  );

}


// 当日の予定表示
function renderDayEvents(){

  const dayEvents =
    document.getElementById("dayEvents");

  dayEvents.innerHTML = "";

  if(
    !events[selectedDay] ||
    events[selectedDay].length === 0
  ){

    dayEvents.innerHTML =
      "<div class='no-schedule'>予定はありません</div>";

    return;
  }

  events[selectedDay].forEach((ev,index)=>{

    const div =
      document.createElement("div");

    div.className =
      "modal-event-item";

    // 左側
    const textDiv =
      document.createElement("div");

    textDiv.innerHTML = `
      ${ev.time}
      ｜ ${ev.name}
      ｜ ${ev.schedule}
    `;

    // 削除ボタン
    const deleteBtn =
      document.createElement("button");

    deleteBtn.className =
      "delete-btn";

    deleteBtn.innerText = "削除";

    // ここが修正版
    deleteBtn.addEventListener(
      "click",
      function(event){

        // 親クリック防止
        event.stopPropagation();

        deleteEvent(index);

      }
    );

    div.appendChild(textDiv);
    div.appendChild(deleteBtn);

    dayEvents.appendChild(div);

  });

}


// 月切替
function changeMonth(num){

  currentDate.setMonth(
    currentDate.getMonth() + num
  );

  renderCalendar();
}


// 当月一覧
function renderMonthlyList(){

  const monthlyList =
    document.getElementById("monthlyList");

  monthlyList.innerHTML = "";

  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth() + 1;

  let allSchedules = [];

  for(const date in events){

    const split = date.split("-");

    const y = Number(split[0]);
    const m = Number(split[1]);

    if(y === year && m === month){

      events[date].forEach(ev=>{

        allSchedules.push({
          date,
          ...ev
        });

      });
    }
  }

  // 並び替え
  allSchedules.sort((a,b)=>{

    if(a.date === b.date){

      return a.time.localeCompare(b.time);
    }

    return new Date(a.date) -
           new Date(b.date);

  });

  if(allSchedules.length === 0){

    monthlyList.innerHTML =
      `<div class="no-schedule">
        予定はありません
      </div>`;

    return;
  }

  allSchedules.forEach(item=>{

    const div =
      document.createElement("div");

    div.className = "list-item";

    div.innerHTML = `
      <strong>${item.date}</strong>
      ｜ ${item.time}
      ｜ ${item.name}
      ｜ ${item.schedule}
    `;

    monthlyList.appendChild(div);

  });

}


renderCalendar();

</script>

</body>
</html>
