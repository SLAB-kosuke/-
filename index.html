<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>我が家の予定</title>

  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#4a90e2">

  <link rel="apple-touch-icon" href="icon-192.png">

</head>

<body>

<!-- ログイン -->

<div id="loginScreen">

  <div class="login-box">

    <h2>我が家の予定</h2>

    <p>4桁パスワード</p>

    <input
      type="password"
      id="passwordInput"
      maxlength="4"
      placeholder="1234">

    <button onclick="login()">
      ログイン
    </button>

  </div>

</div>

<!-- 本体 -->

<h1>家族スケジュール</h1>

<div class="calendar-header">

  <button onclick="changeMonth(-1)">
    ◀ 前月
  </button>

  <h2 id="monthYear"></h2>

  <button onclick="changeMonth(1)">
    次月 ▶
  </button>

</div>

<div class="calendar" id="calendar"></div>

<div class="schedule-list">

  <h2>当月の予定一覧</h2>

  <div id="monthlyList"></div>

</div>

<!-- モーダル -->

<div class="modal" id="modal">

  <div class="modal-content">

    <h2 id="selectedDate"></h2>

    <select id="name">

      <option value="">名前を選択</option>

      <option value="パパ">パパ</option>
      <option value="ママ">ママ</option>
      <option value="トウカ">トウカ</option>
      <option value="ヒヨリ">ヒヨリ</option>
      <option value="祖母">祖母</option>
      <option value="祖父">祖父</option>

    </select>

    <input
      type="text"
      id="schedule"
      placeholder="予定">

    <select id="hour"></select>

    <select id="minute">

      <option value="00">00</option>
      <option value="30">30</option>

    </select>

    <select id="repeatType">
```html
<select id="repeatType">

  <option value="none">
    繰り返しなし
  </option>

  <option value="weekly">
    毎週
  </option>

  <option value="monthly">
    毎月
  </option>

  <option value="other">
    その他
  </option>

</select>

<input
  type="date"
  id="repeatEnd"
  placeholder="終了日">

<p style="font-size:12px;">
  予定カラー
</p>

<input
  type="color"
  id="eventColor"
  value="#4a90e2">
```


    <div class="actions">

      <button
        class="close-btn"
        onclick="closeModal()">

        閉じる

      </button>

      <button
        class="save-btn"
        onclick="saveEvent()">

        決定

      </button>

    </div>

    <h3>この日の予定</h3>

    <div id="dayEvents"></div>

  </div>

</div>
